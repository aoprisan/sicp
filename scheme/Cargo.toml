[package]
name = "sicp-scheme"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "From-scratch Scheme (SICP dialect) with a CEK evaluator, for WASM"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "sicp-scheme"
path = "src/main.rs"

[dependencies]
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
num-integer = "0.1"
wasm-bindgen = { version = "0.2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
wasm = ["wasm-bindgen"]

[profile.release]
opt-level = "s"
lto = true
