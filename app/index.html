<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>SICP</title>
  <link rel="icon" href="/icon.svg" />
  <link rel="stylesheet" href="/book/fonts/fonts.css" />
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <header id="crumb">
    <button id="contents-open" type="button" aria-expanded="false" aria-controls="contents"
            aria-label="Table of contents" hidden>
      <svg viewBox="0 0 20 14" aria-hidden="true"><path d="M0 1h20M0 7h20M0 13h20" /></svg>
    </button>
    <span id="crumb-text"></span>
  </header>
  <div id="veil"></div>
  <nav id="contents" aria-label="Table of contents"></nav>
  <main id="reader"></main>
  <section id="sheet" aria-label="Scheme REPL">
    <div id="sheet-handle" role="button" aria-label="Expand REPL" tabindex="0"></div>
    <div id="output"></div>
    <div id="editor-host"></div>
    <div id="keyrow"></div>
  </section>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
